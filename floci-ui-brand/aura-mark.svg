<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="glow" cx="30%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Inner sheen -->
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- Dashed orbit ring -->
  <circle cx="32" cy="32" r="19.5" stroke="white" stroke-width="0.9"
    stroke-dasharray="2.2 3.2" opacity="0.3"/>

  <!-- Orbit-to-orbit edges -->
  <line x1="32"   y1="12.5" x2="49"   y2="22"   stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.25"/>
  <line x1="49"   y1="42"   x2="32"   y2="51.5" stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.25"/>
  <line x1="32"   y1="12.5" x2="15"   y2="22"   stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.18"/>
  <line x1="15"   y1="42"   x2="32"   y2="51.5" stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.18"/>
  <line x1="49"   y1="22"   x2="49"   y2="42"   stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.18"/>
  <line x1="15"   y1="22"   x2="15"   y2="42"   stroke="white" stroke-width="1.1" stroke-linecap="round" opacity="0.18"/>

  <!-- Center → orbit spokes -->
  <line x1="32" y1="32" x2="32"   y2="12.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="32" x2="49"   y2="22"   stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="32" x2="49"   y2="42"   stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="32" x2="32"   y2="51.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="32" x2="15"   y2="42"   stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="32" x2="15"   y2="22"   stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Orbit nodes — glow + fill -->
  <!-- Top -->
  <circle cx="32"   cy="12.5" r="5"   fill="white" opacity="0.1"/>
  <circle cx="32"   cy="12.5" r="3.2" fill="white" opacity="0.92"/>
  <!-- Top-right -->
  <circle cx="49"   cy="22"   r="4.2" fill="white" opacity="0.1"/>
  <circle cx="49"   cy="22"   r="2.6" fill="white" opacity="0.82"/>
  <!-- Bottom-right -->
  <circle cx="49"   cy="42"   r="4.8" fill="white" opacity="0.1"/>
  <circle cx="49"   cy="42"   r="3"   fill="white" opacity="0.88"/>
  <!-- Bottom -->
  <circle cx="32"   cy="51.5" r="4.2" fill="white" opacity="0.1"/>
  <circle cx="32"   cy="51.5" r="2.6" fill="white" opacity="0.75"/>
  <!-- Bottom-left -->
  <circle cx="15"   cy="42"   r="4"   fill="white" opacity="0.1"/>
  <circle cx="15"   cy="42"   r="2.5" fill="white" opacity="0.8"/>
  <!-- Top-left -->
  <circle cx="15"   cy="22"   r="3.8" fill="white" opacity="0.1"/>
  <circle cx="15"   cy="22"   r="2.4" fill="white" opacity="0.72"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="6.5" fill="white" opacity="0.14"/>
  <circle cx="32" cy="32" r="4.8" fill="white" opacity="1"/>
  <!-- Center specular highlight -->
  <circle cx="30.2" cy="30.2" r="1.5" fill="white" opacity="0.5"/>
</svg>