# Claims automation — runtime configuration.
# Component standards live here; Aura's capability inference reads these plus the
# dependency manifests.

# ── Secrets ──
vault.address=https://vault.internal:8200
vault.auth.method=kubernetes
vault.namespace=claims

# ── Logging ──
logging.splunk.hec.url=https://splunk-hec.internal:8088/services/collector
logging.splunk.index=claims_automation
logging.splunk.sourcetype=workfusion:process
logging.level.root=INFO

# ── Monitoring ──
dynatrace.oneagent.enabled=true
dynatrace.tenant=abc12345
dynatrace.service.name=claims-automation

# ── Datastores ──
claims.db.url=jdbc:postgresql://claims-db.internal:5432/claims
documents.s3.bucket=claims-documents-prod

# ── Messaging ──
kafka.bootstrap.servers=kafka.internal:9092
kafka.topic.claim-events=claims.events.v2

# ── Platform ──
workfusion.engine.url=https://wf-engine.internal
workfusion.process.retention.days=2555
