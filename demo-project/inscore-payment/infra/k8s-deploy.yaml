apiVersion: apps/v1
kind: Deployment
metadata:
  name: inscore-payment-api
  namespace: inscore-prod
  labels:
    app: inscore-payment
    version: "2.4.1"
    team: platform-engineering
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inscore-payment
  template:
    metadata:
      labels:
        app: inscore-payment
    spec:
      containers:
        - name: payment-api
          image: 123456789.dkr.ecr.us-east-1.amazonaws.com/inscore-payment:2.4.1
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: DYNAMODB_TABLE_PAYMENTS
              value: "inscore-payments"
            - name: DYNAMODB_TABLE_USERS
              value: "inscore-users"
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-detection-svc:8080"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inscore-payment-svc
  namespace: inscore-prod
spec:
  selector:
    app: inscore-payment
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inscore-payment-hpa
  namespace: inscore-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inscore-payment-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
